name: Site (GitHub Pages)

# Public home page and privacy policy of ToolBox (site/), required by the
# Google OAuth consent screen. Deployed from hub-v1, without touching main.
# One-time setup (repository Settings): Pages › Source « GitHub Actions », and
# Environments › github-pages › Deployment branches: allow « hub-v1 ».
on:
  push:
    branches: ['hub-v1']
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
