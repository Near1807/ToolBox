name: Build Windows

on:
  push:
    tags: ['v*']
    # Development branch: get a .exe for every pushed phase without touching main.
    # (workflow_dispatch only becomes available once this file is on main.)
    branches: ['hub-v1']
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release on tags

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (full suite, with complete renders)
        run: npm run test:full

      - name: Coffre on a real NTFS volume (virtual disk, letter changed)
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'coffre-test.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'diskpart-coffre.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=256 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'format fs=ntfs quick label=CoffreTest',
            'assign letter=R'
          ) | Set-Content -Path $script -Encoding ascii
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart: $LASTEXITCODE" }
          $env:COFFRE_TEST_VOLUME = 'R:'
          $env:COFFRE_TEST_VHD = $vhd
          npx vitest run modules/coffre/tests/real-volume.test.ts
          if ($LASTEXITCODE -ne 0) { throw "test sur le vrai volume : $LASTEXITCODE" }

      - name: Native modules load in Electron
        run: npm run check:native

      - name: Build installer and portable .exe
        run: npm run dist:win
        env:
          # Unsigned app (personal use): do not look for a code-signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test packaged app (backend, SQLite, FFmpeg, UI)
        run: node scripts/smoke-test.mjs dist/win-unpacked/ToolBox.exe

      - name: User data survives uninstalling (install, marker, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'ToolBox-Setup-*.exe' | Select-Object -First 1
          ./scripts/uninstall-keeps-data.ps1 -Installer $setup.FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ToolBox-windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --title "ToolBox $GITHUB_REF_NAME" \
            --notes "Voir CHANGELOG.md. Application non signée : voir docs/WINDOWS.md (avertissement SmartScreen)."
