# Signing key of the FUTURE phone app (ADR 0044) — to run ONCE, by hand, by
# Thomas. Not used anywhere yet (the probe app is signed with a debug key).
#
# The repository is public: anyone can download its artifacts and read its
# logs. So the key and its password are NEVER written in the log, and the
# artifact is a 7-Zip archive encrypted (AES-256, file names hidden) with a
# passphrase Thomas chose and stored first in the secret
# KEYSTORE_EXPORT_PASSPHRASE. The artifact is kept 1 day.
# Guide: docs/rapports/2026-11-05-v0.29.2.md (« La clé de signature »).
name: Android keystore (une seule fois)

on:
  # Manual run (available once this file is on the default branch).
  workflow_dispatch:
  # Or a tag pushed by hand (works from hub-v1): android-keystore-1, -2…
  push:
    tags: ['android-keystore-*']

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the export passphrase
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ] || [ ${#PASSPHRASE} -lt 16 ]; then
            echo "::error::Crée d'abord le secret KEYSTORE_EXPORT_PASSPHRASE (16 caractères au moins) : Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 7-Zip (AES-256)
        run: command -v 7z || (sudo apt-get update -q && sudo apt-get install -yq p7zip-full)

      - name: Generate the key (PKCS12, RSA 4096, 10 000 days)
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p work && cd work
          PASSWORD="$(openssl rand -base64 33 | tr -d '/+=\n' | cut -c1-32)"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -noprompt \
            -keystore toolbox-release.jks -storetype PKCS12 \
            -alias toolbox -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=ToolBox" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" > /dev/null
          SHA256="$(keytool -list -v -keystore toolbox-release.jks -storepass "$PASSWORD" -alias toolbox | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')"
          base64 -w0 toolbox-release.jks > toolbox-release.jks.base64
          {
            echo "Clé de signature de la future appli ToolBox (Android)"
            echo "Générée le $(date -u '+%Y-%m-%d %H:%M UTC') par le run ${GITHUB_RUN_ID}."
            echo
            echo "Fichier : toolbox-release.jks (PKCS12)"
            echo "Alias : toolbox"
            echo "Mot de passe (magasin et clé) : $PASSWORD"
            echo "Empreinte SHA-256 du certificat : $SHA256"
            echo
            echo "Secrets GitHub à créer (Settings > Secrets and variables > Actions) :"
            echo "  ANDROID_KEYSTORE_BASE64   = tout le contenu de toolbox-release.jks.base64"
            echo "  ANDROID_KEYSTORE_PASSWORD = le mot de passe ci-dessus"
            echo "  ANDROID_KEY_ALIAS         = toolbox"
            echo "  ANDROID_KEY_PASSWORD      = le mot de passe ci-dessus"
            echo
            echo "CLÉ PERDUE = PLUS AUCUNE MISE À JOUR POSSIBLE SANS DÉSINSTALLER L'APPLI."
            echo "Garde une copie de ce dossier HORS de GitHub (gestionnaire de mots de passe, clé USB)."
          } > LISEZ-MOI.txt
          7z a -t7z -mhe=on -p"$PASSPHRASE" ../toolbox-cle-android.7z toolbox-release.jks toolbox-release.jks.base64 LISEZ-MOI.txt > /dev/null
          cd .. && rm -rf work
          echo "Empreinte SHA-256 du certificat (publique, sans risque) : $SHA256"

      - name: Upload the encrypted archive (kept 1 day)
        uses: actions/upload-artifact@v5
        with:
          name: toolbox-cle-android-chiffree
          path: toolbox-cle-android.7z
          if-no-files-found: error
          retention-days: 1

      - name: Instructions
        run: |
          cat <<'TXT'
          Archive chiffrée prête : artefact « toolbox-cle-android-chiffree » (gardé 1 jour).
          1. Télécharge-le (en bas de cette page, section Artifacts).
          2. Ouvre toolbox-cle-android.7z avec 7-Zip et la phrase de KEYSTORE_EXPORT_PASSPHRASE.
          3. Copie le dossier HORS de GitHub (gestionnaire de mots de passe, clé USB).
          4. Crée les 4 secrets indiqués dans LISEZ-MOI.txt.
          5. Supprime l'artefact (icône corbeille à côté de son nom).
          CLÉ PERDUE = PLUS AUCUNE MISE À JOUR POSSIBLE SANS DÉSINSTALLER L'APPLI.
          TXT
